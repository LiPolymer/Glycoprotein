stages:
  - test

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  cache:
    key:
      files:
        - Glycoprotein/Glycoprotein.csproj
        - Glycoprotein.Tests/Glycoprotein.Tests.csproj
    paths:
      - .nuget/packages
  script:
    - dotnet test Glycoprotein.slnx --logger "console;verbosity=detailed" --logger "trx;LogFileName=results.trx"
  artifacts:
    when: always
    paths:
      - TestResults/*.trx
